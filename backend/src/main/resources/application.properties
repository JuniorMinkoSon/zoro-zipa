spring.application.name=zoro-zipa
server.port=8081

# Neon (managed Postgres, free tier). Set DATABASE_URL / DB_USERNAME / DB_PASSWORD
# as environment variables — get them from your Neon project dashboard.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Neon closes idle connections; keep the pool small and recycle them proactively.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=270000

# Email configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=contact@zorozipa.com

# Admin email for reservation notifications
app.email.admin=bruno488@gmail.com

# File storage configuration
app.file-storage.upload-dir=${APP_FILE_STORAGE_UPLOAD_DIR:uploads}

# Static resources configuration for serving uploads
spring.web.resources.static-locations=file:${APP_FILE_STORAGE_UPLOAD_DIR:uploads}/,classpath:/static/
spring.mvc.static-path-pattern=/static/**

# --- Authentication (JWT) ---
# JWT_SECRET is required (no fallback on purpose): a predictable default value
# baked into the source code is a real vulnerability — anyone reading the repo
# could forge valid admin tokens. Set a long random value as an env var, e.g.:
#   openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial admin account (created automatically on first start if it doesn't exist).
# ADMIN_PASSWORD is required (no fallback) for the same reason as JWT_SECRET above.
app.admin.email=${ADMIN_EMAIL:admin@zorozipa.com}
app.admin.password=${ADMIN_PASSWORD}

# --- Visitor session (entry screen: name + phone) ---
# The browser only ever receives this opaque HttpOnly cookie; the name and phone
# number stay in the `visitors` table.
app.visitor.cookie.name=${VISITOR_COOKIE_NAME:zoro_session}
app.visitor.cookie.max-age-days=${VISITOR_COOKIE_MAX_AGE_DAYS:180}
# When the site and the API share a domain (nginx in front of both), Lax + Secure
# is enough. When the frontend is on Vercel and the API elsewhere, the cookie is
# cross-site: set VISITOR_COOKIE_SAME_SITE=None and VISITOR_COOKIE_SECURE=true.
app.visitor.cookie.same-site=${VISITOR_COOKIE_SAME_SITE:Lax}
app.visitor.cookie.secure=${VISITOR_COOKIE_SECURE:false}

# --- Cloudflare R2 (image storage, free tier) ---
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key=${R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${R2_SECRET_KEY:}
cloudflare.r2.bucket=${R2_BUCKET:zoro-zipa-images}
cloudflare.r2.public-url=${R2_PUBLIC_URL:}

# --- Cloudinary (image storage, free tier) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=zoro-zipa

# Upload size limits (must be >= the 5MB check in UploadController)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Show the real error message in JSON error responses (helps debugging 4xx/5xx from the frontend)
server.error.include-message=always

# Some admin forms omit unchecked checkboxes, which arrive as JSON `null`.
# Without this, Jackson rejects `null` for primitive fields (boolean/int) with a 400.
spring.jackson.deserialization.fail-on-null-for-primitives=false
